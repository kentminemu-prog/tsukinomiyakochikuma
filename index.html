.menu-btn{

.progress-fill{

.card-grid,

/* =========================================================
   セーブ
========================================================= */

const SAVE_KEY="chikuma_monster_save_v03";

let saveData={
 discovered:[1,2,3]
};

function loadSave(){

 try{

  const saved=localStorage.getItem(SAVE_KEY);

  if(saved){
   saveData=JSON.parse(saved);
  }

 }catch(e){
  console.log(e);
 }

 if(!Array.isArray(saveData.discovered)){
  saveData.discovered=[1,2,3];
 }

}

function saveGame(){

 try{
  localStorage.setItem(
   SAVE_KEY,
   JSON.stringify(saveData)
  );
 }catch(e){
  console.log(e);
 }

}

function resetSave(){

 if(!confirm("セーブデータを削除して最初からやり直しますか？")){
  return;
 }

 localStorage.removeItem(SAVE_KEY);

 saveData={
  discovered:[1,2,3]
 };

 updateHome();

 alert("セーブデータをリセットしました。");

}


/* =========================================================
   START
========================================================= */

loadSave();

function startGame(){

 loadSave();
 showScreen("homeScreen");
 updateHome();

}

function continueGame(){

 loadSave();
 showScreen("homeScreen");
 updateHome();

}


/* =========================================================
   SCREEN
========================================================= */

function showScreen(id){

 document.querySelectorAll(".screen")
 .forEach(s=>s.classList.add("hidden"));

 document.getElementById(id)
 .classList.remove("hidden");

 if(id==="homeScreen")updateHome();
 if(id==="cardsScreen")renderCards();
 if(id==="fusionScreen")renderFusion();
 if(id==="monsterScreen")renderMonsterBook();
 if(id==="heritageScreen")renderHeritageBook();

}

========================================================= */

let selectedFusionCards=[];

function renderFusion(){

 const grid=document.getElementById("fusionCards");

 grid.innerHTML="";

 cards.forEach(card=>{

  const selected=
   selectedFusionCards.includes(card.id);

  const div=document.createElement("div");

  div.className=
   "info-card selection-card"+
   (selected?" selected":"");

  div.onclick=()=>addFusionCard(card.id);

  div.innerHTML=`
   <div class="icon">${card.icon}</div>
   <strong>${card.name}</strong>
  `;

  grid.appendChild(div);

 });

 updateFusionSlots();

}


function addFusionCard(id){

 if(selectedFusionCards.includes(id)){

  selectedFusionCards=
   selectedFusionCards.filter(x=>x!==id);

 }else{

  if(selectedFusionCards.length>=3){

   alert("融合できるカードは3枚までです。");
   return;

  }

  selectedFusionCards.push(id);

 }

 showScreen("fusionScreen");

}


function updateFusionSlots(){

 const slot=document.getElementById("fusionSlots");

 if(selectedFusionCards.length===0){

  slot.innerHTML="選択中：0枚";
  return;

 }

 const names=
 selectedFusionCards.map(id=>{
  const card=cards.find(c=>c.id===id);
  return card?card.name:"";
 });

 slot.innerHTML=
 `選択中：${selectedFusionCards.length}枚<br>`+
 names.join(" ＋ ");

}


function sameRecipe(a,b){

 if(a.length!==b.length)return false;

 const x=[...a].sort((a,b)=>a-b);
 const y=[...b].sort((a,b)=>a-b);

 return x.every((v,i)=>v===y[i]);

}


function fuseCards(){

 if(
  selectedFusionCards.length<2||
  selectedFusionCards.length>3
 ){

  alert("2～3枚のカードを選んでください。");
  return;

 }

 const monster=
 monsters.find(m=>
  sameRecipe(
   selectedFusionCards,
   m.recipe
  )
 );

 if(!monster){

  alert(
   "……何も起こらなかった。\n"+
   "別の組み合わせを試してみよう。"
  );

  return;

 }

 if(saveData.discovered.includes(monster.id)){

  alert(`${monster.name}はすでに発見済みです！`);

  selectedFusionCards=[];

  renderFusion();

  return;

 }

 saveData.discovered.push(monster.id);

 saveGame();

 document.getElementById("birthMonster").innerHTML=`

 <div class="detail-box">

  <div class="big-icon">${monster.icon}</div>

  <h2>${monster.name}</h2>

  <p>${monster.rarity}</p>

  <p>${monster.description}</p>

 </div>

 `;

 selectedFusionCards=[];

 showScreen("birthScreen");

}

let selectedBattleMonsterId=null;

function prepareBattle(){

 const grid=
 document.getElementById("battleMonsterGrid");

 grid.innerHTML="";

 selectedBattleMonsterId=null;

 const button=
 document.getElementById("battleStartButton");

 button.disabled=true;

 monsters
 .filter(m=>saveData.discovered.includes(m.id))
 .forEach(monster=>{

   )

   );

  };

  div.innerHTML=`
   <div class="icon">${monster.icon}</div>
   <strong>${monster.name}</strong>
   <div class="muted">
   ${monster.rarity} / HP ${monster.hp}
   </div>
  `;

  grid.appendChild(div);

 });

 showScreen("battleSelectScreen");

}


/* =========================================================
   BATTLE
========================================================= */

let battle=null;

function startBattle(){

 if(!selectedBattleMonsterId){

  alert("モンスターを選んでください。");
  return;

 }

 const player=
 monsters.find(m=>m.id===selectedBattleMonsterId);

 const enemyCandidates=
 monsters.filter(m=>m.id!==player.id);

 const enemy=
 enemyCandidates[
  Math.floor(
   Math.random()*enemyCandidates.length
  )
 ];

 battle={

  player,
  enemy,

  php:player.hp,
  ehp:enemy.hp,

  playerSkillUses:
   Array(player.skills.length).fill(0),

  enemySkillUses:
   Array(enemy.skills.length).fill(0),

  playerTurn:true

 };

 document.getElementById("battleLog").innerHTML="";

 showScreen("battleScreen");

 renderBattle();

 addBattleLog(
  `${player.name} VS ${enemy.name}！`
 );

 addBattleLog(
  `${player.name}のターンです。`
 );

}


function renderBattle(){

 if(!battle)return;

 document.getElementById("playerFighter").innerHTML=
 fighterHTML(
  battle.player,
  battle.php
 );

 document.getElementById("enemyFighter").innerHTML=
 fighterHTML(
  battle.enemy,
  battle.ehp
 );

 renderSkills();

}


function fighterHTML(monster,hp){

 const percent=
 Math.max(
  0,
  Math.min(
   100,
   hp/monster.hp*100
  )
 );

 return`

 <div class="fighter-name">
 ${monster.icon} ${monster.name}
 </div>

 <div class="hp-bar">
 <div class="hp-fill"
 style="width:${percent}%"></div>
 </div>

 <div class="hp-text">
 HP ${hp} / ${monster.hp}
 </div>

 `;

}


function renderSkills(){

 const container=
 document.getElementById("skillList");

 container.innerHTML="";

 if(!battle||!battle.playerTurn){

  container.innerHTML=
  `<div class="muted">敵のターンです……</div>`;

  return;

 }

 battle.player.skills.forEach((skill,index)=>{

  const used=
   battle.playerSkillUses[index];

  const remaining=
   skill.max===99
   ?"∞"
   :Math.max(
    0,
    skill.max-used
   );

  const button=
   document.createElement("button");

  button.className="skill-btn";

  button.disabled=
   skill.max!==99&&
   used>=skill.max;

  button.innerHTML=`

   <span class="skill-name">
   ${skill.name}
   </span>

   <span class="skill-info">
   ${skill.damage>0?`攻撃 ${skill.damage}`:""}
   ${skill.heal>0?`回復 ${skill.heal}`:""}
   ／ 残り ${remaining}回
   </span>

  `;

  button.onclick=
   ()=>playerUseSkill(index);

  container.appendChild(button);

 });

}


function playerUseSkill(index){

 if(!battle||!battle.playerTurn)return;

 const skill=
  battle.player.skills[index];

 if(!skill)return;

 if(
  skill.max!==99&&
  battle.playerSkillUses[index]>=skill.max
 ){
  return;
 }

 battle.playerSkillUses[index]++;

 if(skill.damage>0){

  battle.ehp=
   Math.max(
    0,
    battle.ehp-skill.damage
   );

  addBattleLog(
   `${battle.player.name}の「${skill.name}」！ ${skill.damage}ダメージ！`
  );

 }

 if(skill.heal>0){

  const before=battle.php;

  battle.php=
   Math.min(
    battle.player.hp,
    battle.php+skill.heal
   );

  const actual=
   battle.php-before;

  if(actual>0){

   addBattleLog(
    `${battle.player.name}は${actual}回復した！`
   );

  }

 }

 renderBattle();

 if(battle.ehp<=0){

  finishBattle(true);
  return;

 }

 battle.playerTurn=false;

 renderBattle();

 setTimeout(enemyTurn,900);

}


function enemyTurn(){

 if(!battle)return;

 if(battle.php<=0){

  finishBattle(false);
  return;

 }

 const available=
 battle.enemy.skills
 .map((skill,index)=>({
  skill,
  index
 }))
 .filter(item=>
  item.skill.max===99||
  battle.enemySkillUses[item.index]<
  item.skill.max
 );

 if(available.length===0){

  battle.playerTurn=true;
  renderBattle();
  return;

 }

 const lowHp=
  battle.ehp/battle.enemy.hp<=.45;

 const healing=
  available.filter(item=>
   item.skill.heal>0&&
   item.skill.damage===0
  );

 let candidates=available;

 if(lowHp&&healing.length>0){
  candidates=healing;
 }

 const choice=
  candidates[
   Math.floor(
    Math.random()*candidates.length
   )
  ];

 const skill=choice.skill;
 const index=choice.index;

 battle.enemySkillUses[index]++;

 if(skill.damage>0){

  battle.php=
   Math.max(
    0,
    battle.php-skill.damage
   );

  addBattleLog(
   `${battle.enemy.name}の「${skill.name}」！ ${skill.damage}ダメージ！`
  );

 }

 if(skill.heal>0){

  const before=battle.ehp;

  battle.ehp=
   Math.min(
    battle.enemy.hp,
    battle.ehp+skill.heal
   );

  const actual=
   battle.ehp-before;

  if(actual>0){

   addBattleLog(
    `${battle.enemy.name}は${actual}回復した！`
   );

  }

 }

 renderBattle();

 if(battle.php<=0){

  finishBattle(false);
  return;

 }

 battle.playerTurn=true;

 addBattleLog(
  `${battle.player.name}のターンです。`
 );

 renderBattle();

}


function addBattleLog(text){

 const log=
  document.getElementById("battleLog");

 log.innerHTML+=
  `<div>${text}</div>`;

 log.scrollTop=
  log.scrollHeight;

}


function finishBattle(playerWon){

 const title=
  document.getElementById("resultTitle");

 const text=
  document.getElementById("resultText");

 if(playerWon){

  title.textContent="YOU WIN";

  text.innerHTML=`
   ${battle.player.name}の勝利！<br><br>
   月の都の力が、またひとつ証明された。
  `;

 }else{

  title.textContent="YOU LOSE";

  text.innerHTML=`
   ${battle.enemy.name}の勝利……<br><br>
   もう一度、融合とバトルに挑もう。
  `;

 }

 showScreen("resultScreen");

}

   INITIALIZE
========================================================= */

updateHome();

</script>

<script>

const v04Themes = {

  ids:[

  ]
 }

};


/* =========================================================
   文化財 → テーマ
========================================================= */

function v04GetTheme(cardId){

 for(const key in v04Themes){

  if(v04Themes[key].ids.includes(cardId)){
   return Number(key);
  }

 }

 return null;

}


function v04ThemeName(cardId){

 const themeId=v04GetTheme(cardId);

 if(!themeId)return "";

 return v04Themes[themeId].name;

}


/* =========================================================
   セーブデータ拡張
========================================================= */

if(!Array.isArray(saveData.viewedCards)){
 saveData.viewedCards=[];
}


/* =========================================================
   文化財を見た記録
========================================================= */

function v04MarkViewed(cardId){

 if(!Array.isArray(saveData.viewedCards)){
  saveData.viewedCards=[];
 }

 if(!saveData.viewedCards.includes(cardId)){

  saveData.viewedCards.push(cardId);

  saveGame();

 }

}


/* =========================================================
   ホーム画面に3テーマボタンを追加
========================================================= */

function v04AddHomeButton(){

 const home=document.getElementById("homeScreen");

 if(!home)return;

 if(document.getElementById("v04ThemeButton"))return;

 const button=document.createElement("button");

 button.id="v04ThemeButton";

 button.className="menu-btn";

 button.innerHTML=`
 🧭 日本遺産3テーマ
 <small>「月の都 千曲」を物語から探る</small>
 `;

 button.onclick=()=>v04ShowThemeScreen();

 const heritageButton=
  Array.from(home.querySelectorAll("button"))
  .find(b=>b.textContent.includes("文化財図鑑"));

 if(heritageButton){

  heritageButton.after(button);

 }else{

  home.appendChild(button);

 }

}


/* =========================================================
   3テーマ画面
========================================================= */

function v04CreateThemeScreen(){

 if(document.getElementById("v04ThemeScreen"))return;

 const section=document.createElement("section");

 section.id="v04ThemeScreen";

 section.className="screen hidden";

 section.innerHTML=`

 <div class="header">

  <button class="back-btn"
  onclick="showScreen('homeScreen')">
  ← 戻る
  </button>

  <h2>3つの物語</h2>

 </div>

 <div class="notice">

 日本遺産「月の都 千曲」は、
 29の文化財を3つのテーマで結んだ物語です。

 </div>

 <div id="v04ThemeList"></div>

 `;

 document.getElementById("app")
 .appendChild(section);

}


function v04ShowThemeScreen(){

 v04CreateThemeScreen();

 const container=
  document.getElementById("v04ThemeList");

 container.innerHTML="";

 Object.keys(v04Themes).forEach(key=>{

  const theme=v04Themes[key];

  const viewed=
   theme.ids.filter(id=>
    saveData.viewedCards.includes(id)
   ).length;

  const percent=
   Math.round(
    viewed/theme.ids.length*100
   );

  const div=
   document.createElement("div");

  div.className="v04-theme-card";

  div.innerHTML=`

   <div class="v04-theme-title">
   ${theme.icon} ${theme.name}
   </div>

   <div class="v04-theme-sub">
   ${theme.description}
   </div>

   <div class="v04-theme-progress">
   閲覧した文化財：${viewed} / ${theme.ids.length}
   </div>

   <div class="progress-bar">
    <div class="progress-fill"
    style="width:${percent}%"></div>
   </div>

   <button class="menu-btn"
   onclick="v04ShowThemeCards(${key})">
   このテーマの文化財を見る
   </button>

  `;

  container.appendChild(div);

 });

 showScreen("v04ThemeScreen");

}


/* =========================================================
   テーマ別文化財一覧
========================================================= */

function v04ShowThemeCards(themeId){

 const theme=v04Themes[themeId];

 if(!theme)return;

 showScreen("heritageScreen");

 const grid=
  document.getElementById("heritageGrid");

 grid.innerHTML="";

 const title=
  document.createElement("div");

 title.className="notice";

 title.innerHTML=
  `${theme.icon} <strong>${theme.name}</strong><br>`+
  `${theme.description}`;

 grid.appendChild(title);

 theme.ids.forEach(id=>{

  const card=
   cards.find(c=>c.id===id);

  if(!card)return;

  const div=
   document.createElement("div");

  div.className="info-card";

  div.onclick=
   ()=>showHeritageDetail(card.id);

  div.innerHTML=`

   <div class="icon">${card.icon}</div>

   <strong>${card.name}</strong>

   <div>
   ${card.tags.map(t=>
    `<span class="tag">${t}</span>`
   ).join("")}
   </div>

   <div class="v04-theme-tag">
   ${theme.name}
   </div>

  `;

  grid.appendChild(div);

 });

}


/* =========================================================
   文化財図鑑をVer.0.4仕様に拡張
========================================================= */

const v04OriginalRenderHeritageBook=
 renderHeritageBook;

renderHeritageBook=function(){

 const grid=
  document.getElementById("heritageGrid");

 grid.innerHTML="";

 const filter=
  document.createElement("div");

 filter.className="v04-filter";

 filter.innerHTML=`

 <button class="active"
 onclick="v04FilterHeritage(0,this)">
 すべて
 </button>

 <button
 onclick="v04FilterHeritage(1,this)">
 🌙 遊び心
 </button>

 <button
 onclick="v04FilterHeritage(2,this)">
 🌾 暮らしの知恵
 </button>

 <button
 onclick="v04FilterHeritage(3,this)">
 🌕 月見の地
 </button>

 `;

 grid.appendChild(filter);

 const cardsArea=
  document.createElement("div");

 cardsArea.id="v04HeritageCards";

 grid.appendChild(cardsArea);

/* =========================================================
   文化財フィルター
========================================================= */

function v04FilterHeritage(themeId,button){

 document
 .querySelectorAll(".v04-filter button")
 .forEach(b=>b.classList.remove("active"));

 button.classList.add("active");

 v04RenderHeritageCards(themeId);

}


function v04RenderHeritageCards(themeId){

 const area=
  document.getElementById("v04HeritageCards");

 if(!area)return;

 area.innerHTML="";

 const targetCards=
  themeId===0
   ?cards
   :cards.filter(card=>
    v04GetTheme(card.id)===themeId
   );

 targetCards.forEach(card=>{

  const div=
   document.createElement("div");

  div.className="info-card";

  div.onclick=
   ()=>showHeritageDetail(card.id);

  div.innerHTML=`

   <div class="icon">${card.icon}</div>

   <strong>${card.name}</strong>

   <div>
   ${card.tags.map(t=>
    `<span class="tag">${t}</span>`
   ).join("")}
   </div>

   <div class="v04-theme-tag">
   ${v04Themes[v04GetTheme(card.id)].icon}
   ${v04Themes[v04GetTheme(card.id)].name}
   </div>

  `;

  area.appendChild(div);

 });

}

   文化財詳細にテーマを追加
========================================================= */

const v04OriginalShowHeritageDetail=
 showHeritageDetail;

 v04MarkViewed(id);

  </div>

  <div class="small-label">
  日本遺産「月の都 千曲」
  </div>

  <h2>${card.name}</h2>

  <div>
  ${card.tags.map(t=>
   `<span class="tag">${t}</span>`
  ).join("")}
  </div>

  <div class="v04-hint">

   <div class="v04-hint-title">
   ${theme.icon} 日本遺産のテーマ
   </div>

   ${theme.name}

   <div class="v04-theme-sub">
   ${theme.description}
   </div>

  </div>

  <h3>文化財について</h3>

  <p>
  ${card.description}
  </p>

  <hr style="border-color:#475569">

  <div class="small-label">
  ゲーム属性
  </div>

  <p>
  ${card.tags.join("　")}
  </p>

  <button class="primary-btn"
  onclick="addFusionCard(${card.id})">
  このカードを融合に使う
  </button>

 </div>

 `;

 showScreen("heritageDetailScreen");

};


/* =========================================================
   融合ヒントボタン
========================================================= */

function v04AddFusionHintButton(){

 const fusionScreen=
  document.getElementById("fusionScreen");

 if(!fusionScreen)return;

 if(document.getElementById("v04FusionHint"))return;

 const button=
  document.createElement("button");

 button.id="v04FusionHint";

 button.className="menu-btn";

 button.innerHTML=`
 💡 融合ヒント
 <small>今選んでいるカードから手がかりを探す</small>
 `;

 button.onclick=
  ()=>v04FusionHint();

 const primary=
  fusionScreen.querySelector(".primary-btn");

 if(primary){
  primary.after(button);
 }else{
  fusionScreen.appendChild(button);
 }

}


/* =========================================================
   融合ヒント
========================================================= */

function v04FusionHint(){

 if(selectedFusionCards.length===0){

  alert(
   "まず文化財カードを1枚以上選んでください。"
  );

  return;

 }


 if(selectedFusionCards.length===1){

  const card=
   cards.find(c=>
    c.id===selectedFusionCards[0]
   );

  const theme=
   v04Themes[v04GetTheme(card.id)];

  alert(
   `「${card.name}」は\n`+
   `「${theme.name}」に属する文化財です。\n\n`+
   `同じ物語につながる文化財や、\n`+
   `相性のよさそうな属性を探してみましょう。`
  );

  return;

 }


 const possible=
  monsters.filter(monster=>
   !saveData.discovered.includes(monster.id)&&
   selectedFusionCards.every(id=>
    monster.recipe.includes(id)
   )
  );

 if(possible.length>0){

  const monster=possible[0];

  const recipeLength=
   monster.recipe.length;

  if(
   selectedFusionCards.length===
   recipeLength
  ){

   alert(
    "✨ 強い反応があります！\n\n"+
    "この組み合わせには、\n"+
    "新しいモンスターにつながる可能性があります。"
   );

  }else{

   const missing=
    monster.recipe.filter(id=>
     !selectedFusionCards.includes(id)
    );

   const missingCard=
    cards.find(c=>c.id===missing[0]);

   alert(
    "✨ 何かが反応しています……\n\n"+
    "もう1枚、別の文化財が必要かもしれません。\n\n"+
    "ヒント："+
    missingCard.icon+
    " 「"+missingCard.name+"」のようなカードを探してみよう。"
   );

  }

 }else{

  const themes=
   [...new Set(
    selectedFusionCards.map(id=>
     v04ThemeName(id)
    )
   )];

  alert(
   "今の組み合わせからは、\n"+
   "まだ強い反応を感じません。\n\n"+
   "テーマ：\n"+
   themes.join("\n")+
   "\n\n"+
   "同じテーマだけでなく、\n"+
   異なるテーマを組み合わせるのも試してみよう。"
  );

 }

}

   ミッション画面

function v04ShowMissions(){

 if(!document.getElementById("v04MissionScreen")){

  const section=
   document.createElement("section");

  section.id="v04MissionScreen";

  section.className="screen hidden";

  section.innerHTML=`

   <div class="header">

    onclick="showScreen('homeScreen')">

   </div>

   <div class="notice">

   千曲の3つの物語を完成させよう。

   </div>

   <div id="v04MissionList"></div>

  `;

  document.getElementById("app")
  .appendChild(section);

 }

 const list=
  document.getElementById("v04MissionList");

 list.innerHTML="";

 const missions=[
  {
   theme:1,
   goal:3,
   text:"「古人の遊び心」の文化財を3件見る"
  },
  {
   theme:2,
   goal:5,
   text:"「先人の暮らしの知恵」の文化財を5件見る"
  },
  {
   theme:3,
   goal:5,
   text:"「今に生きる月見の地」の文化財を5件見る"
  }
 ];

 missions.forEach(m=>{

  const count=
   v04Themes[m.theme].ids.filter(id=>
    saveData.viewedCards.includes(id)
   ).length;

  const done=
   count>=m.goal;

  const div=
   document.createElement("div");

  div.className=
   "v04-mission"+
   (done?" done":"");

  div.innerHTML=`

   <div class="v04-mission-title">

   ${done?"✅":"🎯"}

   ${m.text}

   </div>

   <div class="muted">
   ${count} / ${m.goal}
   </div>

  `;

  list.appendChild(div);

 });

 showScreen("v04MissionScreen");

}


/* =========================================================
   起動時に追加機能を準備
========================================================= */

v04CreateThemeScreen();

v04AddHomeButton();

v04CreateMissionButton();

   ホーム更新を拡張
========================================================= */

 updateHome;

updateHome=function(){

 v04OriginalUpdateHome();

 v04AddHomeButton();

 v04CreateMissionButton();
