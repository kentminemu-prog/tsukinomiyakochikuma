<html lang="ja">
<head>
<meta charset="UTF-8">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111827;
  color: #f9fafb;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Yu Gothic",
    "Hiragino Kaku Gothic ProN",
    sans-serif;
}

button {
  font: inherit;
}

#app {
  min-height: 100vh;
  max-width: 600px;
  margin: 0 auto;
  background: #172033;
}

.screen {
  min-height: 100vh;
  padding: 24px 18px 40px;
}

.hidden {
  display: none !important;
}

/* ---------- Title ---------- */

.title-screen {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  background:
    radial-gradient(circle at 50% 25%, #384765 0, #172033 42%, #0d1422 100%);
}

.moon {
  width: 130px;
  height: 130px;
  border-radius: 50%;
  background: #f6e7a6;
  box-shadow: 0 0 50px rgba(246, 231, 166, .35);
  margin-bottom: 28px;
}

.title {
  font-size: 36px;
  letter-spacing: .12em;
  margin: 0;
}

.subtitle {
  margin: 12px 0 40px;
  color: #cbd5e1;
  letter-spacing: .2em;
}

/* ---------- Common ---------- */

h1, h2, h3 {
  margin-top: 0;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 22px;
}

.back-btn {
  border: 0;
  background: #334155;
  color: white;
  padding: 9px 14px;
  border-radius: 10px;
}

.primary-btn,
.menu-btn,
.card-btn,
.skill-btn {
  width: 100%;
  border: 0;
  border-radius: 14px;
  padding: 15px;
  color: white;
  background: #475569;
  margin-top: 10px;
  cursor: pointer;
}

.primary-btn {
  background: #7c5cff;
  font-weight: bold;
}

.menu-btn {
  text-align: left;
  font-size: 18px;
  padding: 18px;
  background: #26344d;
}

.menu-btn small {
  display: block;
  color: #94a3b8;
  font-size: 12px;
  margin-top: 5px;
}

.danger-btn {
  background: #7f1d1d;
}

.card-grid,
.monster-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.info-card,
.monster-card {
  background: #26344d;
  border-radius: 14px;
  padding: 14px;
}

.info-card {
  cursor: pointer;
}

.icon {
  font-size: 30px;
  margin-bottom: 8px;
}

.tag {
  display: inline-block;
  background: #374151;
  border-radius: 999px;
  padding: 4px 8px;
  margin: 3px 2px;
  font-size: 12px;
}

.muted {
  color: #94a3b8;
}

.notice {
  background: #26344d;
  border-left: 4px solid #7c5cff;
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 16px;
}

/* ---------- Home ---------- */

.progress {
  background: #26344d;
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 20px;
}

/* ---------- Detail ---------- */

.detail-box {
  background: #26344d;
  border-radius: 16px;
  padding: 20px;
}

.big-icon {
  font-size: 70px;
  text-align: center;
  margin: 10px 0 20px;
}

/* ---------- Birth ---------- */

.birth {
  text-align: center;
  padding-top: 60px;
}

.birth-icon {
  font-size: 90px;
  animation: pulse 1.4s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.12); }
}

/* ---------- Battle ---------- */

.battle-area {
  background: #0f172a;
  border-radius: 18px;
  padding: 16px;
}

.fighter {
  background: #26344d;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 14px;
}

.fighter-name {
  font-size: 20px;
  font-weight: bold;
}

.hp-bar {
  height: 16px;
  background: #111827;
  border-radius: 999px;
  overflow: hidden;
  margin: 10px 0;
}

.hp-fill {
  height: 100%;
  background: #22c55e;
  transition: width .3s;
}

.hp-text {
  font-size: 13px;
  color: #cbd5e1;
}

.battle-log {
  background: #111827;
  border-radius: 12px;
  padding: 12px;
  height: 150px;
  overflow-y: auto;
  font-size: 13px;
  line-height: 1.7;
  margin: 14px 0;
}

.skill-list {
  display: grid;
  gap: 8px;
}

.skill-btn {
  margin-top: 0;
  background: #334155;
}

.skill-btn:disabled {
  opacity: .4;
}

.skill-name {
  font-weight: bold;
}

.skill-info {
  display: block;
  font-size: 11px;
  color: #cbd5e1;

/* ---------- Result ---------- */

.result-title {

/* ---------- Selection ---------- */

.selection-card {
  cursor: pointer;
  border: 2px solid transparent;
}

.selection-card.selected {
  border-color: #a78bfa;
  background: #374151;
}

/* ---------- Footer ---------- */

.footer {
  margin-top: 35px;
  text-align: center;
  color: #64748b;

}
</style>

/* =========================================================
   セーブデータ
========================================================= */

const SAVE_KEY = "chikuma_monster_save_v02";

let saveData = {
  discovered: [1,2,3]
};

function loadSave() {

  try {

    const saved = localStorage.getItem(SAVE_KEY);

    if (saved) {
      saveData = JSON.parse(saved);
    }

  } catch (e) {

    console.log("セーブデータ読み込みエラー", e);

  }

  if (!Array.isArray(saveData.discovered)) {
    saveData.discovered = [1,2,3];
  }

}


function saveGame() {

  try {

    localStorage.setItem(
      SAVE_KEY,
      JSON.stringify(saveData)
    );

  } catch (e) {

    console.log("セーブエラー", e);

  }

}


function resetSave() {

  const ok = confirm(
    "セーブデータを削除して最初からやり直しますか？"
  );

  if (!ok) return;

  localStorage.removeItem(SAVE_KEY);

  saveData = {
    discovered: [1,2,3]
  };

  updateHome();

  alert("セーブデータをリセットしました。");

}


/* =========================================================
   初期化
========================================================= */

loadSave();


function startGame() {

  loadSave();

  showScreen("homeScreen");

  updateHome();

}


function continueGame() {

  loadSave();

  showScreen("homeScreen");

  updateHome();

}


/* =========================================================
   画面切り替え
========================================================= */

function showScreen(id) {

  document.querySelectorAll(".screen").forEach(screen => {
    screen.classList.add("hidden");
  });

  document.getElementById(id).classList.remove("hidden");

  if (id === "homeScreen") {
    updateHome();
  }

  if (id === "cardsScreen") {
    renderCards();
  }

  if (id === "fusionScreen") {
    renderFusion();
  }

  if (id === "monsterScreen") {
    renderMonsterBook();
  }

}


/* =========================================================
   ホーム
========================================================= */

function updateHome() {

  const count = saveData.discovered.length;

  document.getElementById("progressText").textContent =
    `発見モンスター ${count} / ${monsters.length}`;

}


/* =========================================================
   文化財カード
========================================================= */

function renderCards() {

  const grid = document.getElementById("cardGrid");

  grid.innerHTML = "";

  cards.forEach(card => {

    const div = document.createElement("div");

    div.className = "info-card";

    div.onclick = () => showCardDetail(card.id);

    div.innerHTML = `
      <div class="icon">${card.icon}</div>
      <strong>${card.name}</strong>
      <div>
        ${card.tags.map(tag =>
          `<span class="tag">${tag}</span>`
        ).join("")}
      </div>
    `;

    grid.appendChild(div);

  });

}


function showCardDetail(id) {

  const card = cards.find(c => c.id === id);

  if (!card) return;

  document.getElementById("cardDetail").innerHTML = `
    <div class="detail-box">

      <div class="big-icon">${card.icon}</div>

      <h2>${card.name}</h2>

      <div>
        ${card.tags.map(tag =>
          `<span class="tag">${tag}</span>`
        ).join("")}
      </div>

      <p>${card.description}</p>

      <button class="primary-btn"
              onclick="addFusionCard(${card.id})">
        このカードを融合に使う
      </button>

    </div>
  `;

  showScreen("cardDetailScreen");

}


/* =========================================================
   融合
========================================================= */

let selectedFusionCards = [];


function renderFusion() {

  const grid = document.getElementById("fusionCards");

  grid.innerHTML = "";

  cards.forEach(card => {

    const selected =
      selectedFusionCards.includes(card.id);

    const div = document.createElement("div");

    div.className =
      "info-card selection-card" +
      (selected ? " selected" : "");

    div.onclick = () => addFusionCard(card.id);

    div.innerHTML = `
      <div class="icon">${card.icon}</div>
      <strong>${card.name}</strong>
    `;

    grid.appendChild(div);

  });

  updateFusionSlots();

}


function addFusionCard(id) {

  if (selectedFusionCards.includes(id)) {

    selectedFusionCards =
      selectedFusionCards.filter(x => x !== id);

  } else {

    if (selectedFusionCards.length >= 3) {

      alert("融合できるカードは3枚までです。");

      return;

    }

    selectedFusionCards.push(id);

  }

  showScreen("fusionScreen");

}


function updateFusionSlots() {

  const slot = document.getElementById("fusionSlots");

  if (selectedFusionCards.length === 0) {

    slot.innerHTML = "選択中：0枚";

    return;

  }

  const names = selectedFusionCards.map(id => {

    const card = cards.find(c => c.id === id);

    return card ? card.name : "";

  });

  slot.innerHTML =
    `選択中：${selectedFusionCards.length}枚<br>` +
    names.join(" ＋ ");

}


function sameRecipe(a, b) {

  if (a.length !== b.length) {
    return false;
  }

  const x = [...a].sort((a,b) => a-b);
  const y = [...b].sort((a,b) => a-b);

  return x.every((v,i) => v === y[i]);

}


function fuseCards() {

  if (
    selectedFusionCards.length < 2 ||
    selectedFusionCards.length > 3
  ) {

    alert("2～3枚のカードを選んでください。");

    return;

  }

  const monster =
    monsters.find(m =>
      sameRecipe(
        selectedFusionCards,
        m.recipe
      )
    );

  if (!monster) {

    alert(
      "……何も起こらなかった。\n" +
      "別の組み合わせを試してみよう。"
    );

    return;

  }

  if (!saveData.discovered.includes(monster.id)) {

    saveData.discovered.push(monster.id);

    saveGame();

    document.getElementById("birthMonster").innerHTML = `
      <div class="detail-box">

        <div class="big-icon">${monster.icon}</div>

        <h2>${monster.name}</h2>

        <p>${monster.rarity}</p>

      </div>
    `;

    selectedFusionCards = [];

    showScreen("birthScreen");

  } else {

    alert(
      `${monster.name}はすでに発見済みです！`
    );

    selectedFusionCards = [];

    renderFusion();

  }

}


let birthMonsterId = null;


function showMonsterFromBirth() {

  const monster =
    monsters.find(m =>
      m.recipe.length === 0
    );

  showScreen("monsterScreen");

}


/* =========================================================
   モンスター図鑑
========================================================= */

function renderMonsterBook() {

  const grid =
    document.getElementById("monsterGrid");

  grid.innerHTML = "";

  monsters.forEach(monster => {

    const discovered =
      saveData.discovered.includes(monster.id);

    const div =
      document.createElement("div");

    div.className = "monster-card";

    if (discovered) {

      div.onclick =
        () => showMonsterDetail(monster.id);

      div.innerHTML = `
        <div class="icon">${monster.icon}</div>
        <strong>${monster.name}</strong>
        <div class="muted">${monster.rarity}</div>
      `;

    } else {

      div.innerHTML = `
        <div class="icon">❓</div>
        <strong>？？？？？</strong>
        <div class="muted">未発見</div>
      `;

    }

    grid.appendChild(div);

  });

}


function showMonsterDetail(id) {

  const monster =
    monsters.find(m => m.id === id);

  if (!monster) return;

  const recipeNames =
    monster.recipe.map(cardId => {

      const card =
        cards.find(c => c.id === cardId);

      return card ? card.name : "";

    });

  document.getElementById("monsterDetail").innerHTML = `
    <div class="detail-box">

      <div class="big-icon">${monster.icon}</div>

      <h2>${monster.name}</h2>

      <p>${monster.rarity}</p>

      <p>${monster.description}</p>

      <p>
        <strong>HP：</strong>${monster.hp}
      </p>

      <p>
        <strong>融合素材：</strong><br>
        ${recipeNames.join(" ＋ ")}
      </p>

      <h3>スキル</h3>

      ${monster.skills.map(skill => `
        <div class="info-card" style="margin-top:8px;">
          <strong>${skill.name}</strong><br>
          ${skill.damage > 0 ? `攻撃 ${skill.damage}` : ""}
          ${skill.heal > 0 ? `回復 ${skill.heal}` : ""}
        </div>
      `).join("")}

    </div>
  `;

  showScreen("monsterDetailScreen");

}


/* =========================================================
   バトル選択
========================================================= */

let selectedBattleMonsterId = null;


function prepareBattle() {

  const grid =
    document.getElementById("battleMonsterGrid");

  grid.innerHTML = "";

  selectedBattleMonsterId = null;

  const startButton =
    document.getElementById("battleStartButton");

  startButton.disabled = true;

  const discoveredMonsters =
    monsters.filter(m =>
      saveData.discovered.includes(m.id)
    );

  discoveredMonsters.forEach(monster => {

    const div =
      document.createElement("div");

    div.className =
      "monster-card selection-card";

    div.onclick = () => {

      document
        .querySelectorAll("#battleMonsterGrid .selection-card")
        .forEach(el =>
          el.classList.remove("selected")
        );

      div.classList.add("selected");

      selectedBattleMonsterId =
        monster.id;

      startButton.disabled = false;

    };

    div.innerHTML = `
      <div class="icon">${monster.icon}</div>
      <strong>${monster.name}</strong>
      <div class="muted">
        ${monster.rarity} / HP ${monster.hp}
      </div>
    `;

    grid.appendChild(div);

  });

  showScreen("battleSelectScreen");

}


/* =========================================================
   バトル
========================================================= */

let battle = null;


function startBattle() {

  if (!selectedBattleMonsterId) {

    alert("モンスターを選んでください。");

    return;

  }

  const player =
    monsters.find(m =>
      m.id === selectedBattleMonsterId
    );

  const enemyCandidates =
    monsters.filter(m =>
      m.id !== player.id
    );

  const enemy =
    enemyCandidates[
      Math.floor(
        Math.random() *
        enemyCandidates.length
      )
    ];

  battle = {

    player: player,
    enemy: enemy,

    php: player.hp,
    ehp: enemy.hp,

    playerSkillUses:
      Array(player.skills.length).fill(0),

    enemySkillUses:
      Array(enemy.skills.length).fill(0),

    playerTurn: true

  };

  document.getElementById("battleLog").innerHTML = "";

  showScreen("battleScreen");

  renderBattle();

  addBattleLog(
    `${player.name} VS ${enemy.name}！`
  );

  addBattleLog(
    `${player.name}のターンです。`
  );

}


function renderBattle() {

  if (!battle) return;

  const p =
    document.getElementById("playerFighter");

  const e =
    document.getElementById("enemyFighter");

  p.innerHTML = fighterHTML(
    battle.player,
    battle.php
  );

  e.innerHTML = fighterHTML(
    battle.enemy,
    battle.ehp
  );

  renderSkills();

}


function fighterHTML(monster, hp) {

  const percent =
    Math.max(
      0,
      Math.min(
        100,
        hp / monster.hp * 100
      )
    );

  return `
    <div class="fighter-name">
      ${monster.icon} ${monster.name}
    </div>

    <div class="hp-bar">
      <div
        class="hp-fill"
        style="width:${percent}%">
      </div>
    </div>

    <div class="hp-text">
      HP ${hp} / ${monster.hp}
    </div>
  `;

}


function renderSkills() {

  const container =
    document.getElementById("skillList");

  container.innerHTML = "";

  if (!battle || !battle.playerTurn) {

    container.innerHTML =
      `<div class="muted">敵のターンです……</div>`;

    return;

  }

  battle.player.skills.forEach((skill, index) => {

    const used =
      battle.playerSkillUses[index];

    const remaining =
      skill.max === 99
        ? "∞"
        : Math.max(
            0,
            skill.max - used
          );

    const button =
      document.createElement("button");

    button.className = "skill-btn";

    button.disabled =
      skill.max !== 99 &&
      used >= skill.max;

    button.innerHTML = `
      <span class="skill-name">
        ${skill.name}
      </span>
      <span class="skill-info">
        ${skill.damage > 0
          ? `攻撃 ${skill.damage}`
          : ""}
        ${skill.heal > 0
          ? `回復 ${skill.heal}`
          : ""}
        ／ 残り ${remaining}回
      </span>
    `;

    button.onclick =
      () => playerUseSkill(index);

    container.appendChild(button);

  });

}


function playerUseSkill(index) {

  if (!battle || !battle.playerTurn) {
    return;
  }

  const skill =
    battle.player.skills[index];

  if (!skill) return;

  if (
    skill.max !== 99 &&
    battle.playerSkillUses[index] >= skill.max
  ) {

    return;

  }

  battle.playerSkillUses[index]++;

  if (skill.damage > 0) {

    battle.ehp =
      Math.max(
        0,
        battle.ehp - skill.damage
      );

    addBattleLog(
      `${battle.player.name}の「${skill.name}」！ ${skill.damage}ダメージ！`
    );

  }

  if (skill.heal > 0) {

    const before = battle.php;

    battle.php =
      Math.min(
        battle.player.hp,
        battle.php + skill.heal
      );

    const actual =
      battle.php - before;

    if (actual > 0) {

      addBattleLog(
        `${battle.player.name}は${actual}回復した！`
      );

    }

  }

  renderBattle();

  if (battle.ehp <= 0) {

    finishBattle(true);

    return;

  }

  battle.playerTurn = false;

  renderBattle();

  setTimeout(enemyTurn, 900);

}


function enemyTurn() {

  if (!battle) return;

  if (battle.php <= 0) {

    finishBattle(false);

    return;

  }

  const available =
    battle.enemy.skills
      .map((skill, index) => ({
        skill,
        index
      }))
      .filter(item =>
        item.skill.max === 99 ||
        battle.enemySkillUses[item.index] < item.skill.max
      );

  if (available.length === 0) {

    battle.playerTurn = true;

    renderBattle();

    return;

  }

  /*
    敵の行動選択

    基本的には攻撃系を優先し、
    HPが低い場合は回復技を選ぶ。
  */

  let candidates = available;

  const enemyHpRate =
    battle.ehp / battle.enemy.hp;

  const healing =
    available.filter(item =>
      item.skill.heal > 0 &&
      item.skill.damage === 0
    );

  if (
    enemyHpRate <= 0.45 &&
    healing.length > 0
  ) {

    candidates = healing;

  }

  const choice =
    candidates[
      Math.floor(
        Math.random() *
        candidates.length
      )
    ];

  const skill = choice.skill;
  const index = choice.index;

  battle.enemySkillUses[index]++;

  if (skill.damage > 0) {

    battle.php =
      Math.max(
        0,
        battle.php - skill.damage
      );

    addBattleLog(
      `${battle.enemy.name}の「${skill.name}」！ ${skill.damage}ダメージ！`
    );

  }

  if (skill.heal > 0) {

    const before = battle.ehp;

    battle.ehp =
      Math.min(
        battle.enemy.hp,
        battle.ehp + skill.heal
      );

    const actual =
      battle.ehp - before;

    if (actual > 0) {

      addBattleLog(
        `${battle.enemy.name}は${actual}回復した！`
      );

    }

  }

  renderBattle();

  if (battle.php <= 0) {

    finishBattle(false);

    return;

  }

  battle.playerTurn = true;

  addBattleLog(
    `${battle.player.name}のターンです。`
  );

  renderBattle();

}


function addBattleLog(text) {

  const log =
    document.getElementById("battleLog");

  log.innerHTML +=
    `<div>${text}</div>`;

  log.scrollTop =
    log.scrollHeight;

}


function finishBattle(playerWon) {

  const title =
    document.getElementById("resultTitle");

  const text =
    document.getElementById("resultText");

  if (playerWon) {

    title.textContent = "YOU WIN";

    text.innerHTML = `
      ${battle.player.name}の勝利！<br><br>
      月の都の力が、またひとつ証明された。
    `;

  } else {

    title.textContent = "YOU LOSE";

    text.innerHTML = `
      ${battle.enemy.name}の勝利……<br><br>
      もう一度、融合とバトルに挑もう。
    `;

  }

  showScreen("resultScreen");

}


/* =========================================================
   起動
========================================================= */

updateHome();

</script>
